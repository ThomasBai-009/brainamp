function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
var keyP=null;
function importRaw(r){return crypto.subtle.importKey('raw',r,'AES-GCM',false,['decrypt']);}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){

function show(html){document.open();document.write(html);document.close();}
function tryKey(raw,remember){var kp=importRaw(raw);return kp.then(function(k){return dec(k,C.data);}).then(function(html){

  window.NF_DECRYPT=function(b64){return keyP.then(function(k){return dec(k,b64);});};show(html);});}
