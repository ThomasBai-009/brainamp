function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
var keyP=null;
function importRaw(r){return crypto.subtle.importKey('raw',r,'AES-GCM',false,['decrypt']);}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b2u(C.salt),iterations:C.iter},k,256);}).then(function(b){return new Uint8Array(b);});}
function dec(key,b64){var d=b2u(b64);return crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12)).then(function(p){return new TextDecoder().decode(p);});}
window.NF_DECRYPT=function(b64){return keyP.then(function(k){return dec(k,b64);});};
function show(html){document.open();document.write(html);document.close();}
function tryKey(raw,remember){var kp=importRaw(raw);return kp.then(function(k){return dec(k,C.data);}).then(function(html){
  keyP=kp;if(remember){try{localStorage.setItem(LK,u2b(raw));}catch(e){}}
  window.NF_DECRYPT=function(b64){return keyP.then(function(k){return dec(k,b64);});};show(html);});}
function gate(){var f=document.getElementById('nfgate'),pw=document.getElementById('nfpw'),msg=document.getElementById('nfmsg');f.style.display='';pw.focus();

    derive(pw.value).then(function(raw){return tryKey(raw,document.getElementById('nfrem').checked);}).catch(function(){msg.textContent='密码错误，请重试';pw.select();});});}
